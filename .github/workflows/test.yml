name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          bash -n "${files[@]}"
      - name: Run regression tests
        run: bash tests/run.sh
      - name: Ensure jq
        run: |
          command -v jq >/dev/null || sudo apt-get update
          command -v jq >/dev/null || sudo apt-get install -y jq
      - name: Test configuration rendering
        run: REQUIRE_JQ=1 bash tests/render.sh

  # Real install against the live official Xray installer on a systemd VM.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [reality, xhttp-reality]
    steps:
      - uses: actions/checkout@v7
      - name: One-key setup (${{ matrix.mode }})
        # Shared runners sometimes get HTTP 403 from the GitHub API when the
        # official installer fetches the release list. Setup is idempotent
        # with --mode, so retry a couple of times before calling it broken.
        run: |
          for attempt in 1 2 3; do
            sudo ./xrayctl.sh setup --mode "${{ matrix.mode }}" -y && exit 0
            [ "$attempt" -lt 3 ] || break
            echo "::warning::setup attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          exit 1
      - name: Doctor
        run: sudo ./xrayctl.sh doctor --offline
      - name: Share link
        run: sudo ./xrayctl.sh link --raw
