name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          bash -n "${files[@]}"
      - name: Run regression tests
        run: bash tests/run.sh
      - name: Ensure jq
        run: |
          command -v jq >/dev/null || sudo apt-get update
          command -v jq >/dev/null || sudo apt-get install -y jq
      - name: Test configuration rendering
        run: REQUIRE_JQ=1 bash tests/render.sh
